spring.datasource.url=jdbc:postgresql://localhost:5432/safecar
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=17
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql= false
spring.jpa.properties.hibernate.format_sql= false

spring.data.redis.host=localhost
spring.data.redis.port=6379

sensor.limit.speed=150
sensor.limit.rpm=5000

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
spring.application.name=safecar-api

server.tomcat.threads.max=12
server.tomcat.threads.min=12
server.tomcat.accept-count=1000

# RabbitMQ Connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Listener
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=10

# 배치 주기 (기본값은 운영 기준: 중간 집계 매시 정각 / 일일 정산 매일 00:05에 전날을 정산)
# 기능 확인 때는 주기를 줄여서 실행한다. 예) 중간 집계를 매분, 일일 정산을 매시 정각에 오늘 기준으로:
#   batch.hourly-stats.cron=0 * * * * *
#   batch.hourly-stats.window-minutes=1
#   batch.daily-stats.cron=0 0 * * * *
#   batch.daily-stats.target-days-ago=0
batch.hourly-stats.cron=0 0 * * * *
batch.hourly-stats.window-minutes=60
batch.daily-stats.cron=0 5 0 * * *
batch.daily-stats.target-days-ago=1
